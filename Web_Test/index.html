<!DOCTYPE html>
<html>
<head>
    <title>HIMU test</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        video {
            width: 1280px;
            height: 720px;
        }

        button {
            margin-top: 12px;
            padding: 8px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            color: #aaa;
            margin-top: 8px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <button id="btn">Conectar</button>
    <div id="status">Desconectado</div>

    <script>
        const video = document.getElementById('video');
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');

        let pc = null;
        let ws = null;

        btn.onclick = () => connect();

        function setStatus(msg) {
            status.textContent = msg;
            console.log(msg);
        }

        async function connect() {
            btn.disabled = true;
            let pendingCandidates = [];
            setStatus('Conectando a señalización...');

            ws = new WebSocket('ws://localhost:8080?type=browser');
            ws.binaryType = "arraybuffer";

            ws.onopen = async () => {
                setStatus('Conectado a señalización. Creando oferta...');

                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                pc.ontrack = (event) => {
                    setStatus('Stream recibido ✓');
                    video.srcObject = event.streams[0];
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        ws.send(JSON.stringify({
                            type: 'ice',
                            candidate: event.candidate.candidate,
                            sdpMid: event.candidate.sdpMid,
                            sdpMLineIndex: event.candidate.sdpMLineIndex
                        }));
                    }
                };

                pc.onconnectionstatechange = () => {
                    setStatus(`WebRTC: ${pc.connectionState}`);
                    if (pc.connectionState === 'failed') btn.disabled = false;
                };

                pc.addTransceiver('video', { direction: 'recvonly' });

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: 'offer', sdp: offer.sdp }));
                setStatus('Oferta enviada, esperando respuesta...');
            };

            ws.onmessage = async (event) => {
                let json;
                if (event.data instanceof ArrayBuffer) {
                    json = new TextDecoder().decode(event.data);
                } else {
                    json = event.data;
                }

                const msg = JSON.parse(json); // ← fix bug 1

                if (msg.type === 'answer') {
                    await pc.setRemoteDescription({ type: 'answer', sdp: msg.sdp });
                    setStatus('Respuesta recibida, negociando ICE...');

                    for (const c of pendingCandidates) {
                        await pc.addIceCandidate(c).catch(e => console.warn("ICE error:", e));
                    }
                    pendingCandidates = [];
                }
                else if (msg.type === 'ice') {
                    const candidate = {
                        candidate: msg.candidate,
                        sdpMid: msg.sdpMid,
                        sdpMLineIndex: msg.sdpMLineIndex
                    };

                    if (!pc.remoteDescription) {
                        pendingCandidates.push(candidate);
                    } else {
                        await pc.addIceCandidate(candidate).catch(e => console.warn("ICE error:", e));
                    }
                }
            };

            ws.onerror = () => {
                setStatus('Error de señalización');
                btn.disabled = false;
            };
        }
    </script>
</body>
</html>
